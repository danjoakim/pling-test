# Builds the Prek! iPhone app (Capacitor) and sends it to TestFlight. Run by hand (Actions -> ios -> Run workflow).
# Needs the secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (App Store Connect API key, role App Manager). See claude/iphone-app.md.
# The build number is the run number, so every upload is newer than the last. Errors are written as annotations (see desktop.yml).
name: ios
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: ios
    env:
      CI: "true"
      NO_COLOR: "1"
      TEAM: TEXEV54M7D
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          source ../desktop/ci-step.sh
          step npm-install npm install --no-audit --no-fund
      - name: Page and iOS project
        run: |
          source ../desktop/ci-step.sh
          step prepare node prepare.js
          step cap-add npx cap add ios
          # the App Store wants the 1024 icon without transparency
          python3 -m venv "$RUNNER_TEMP/v" && step pillow "$RUNNER_TEMP/v/bin/pip" install pillow
          step icon "$RUNNER_TEMP/v/bin/python" ../desktop/flatten-icon.py ../desktop/app-icon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          # Apple requires iOS 15 or later from April 2027 (ITMS-90068)
          step target bash -c "sed -i '' 's/platform :ios, .14.0./platform :ios, '15.0'/' ios/App/Podfile; sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' ios/App/App.xcodeproj/project.pbxproj; grep -n 'platform' ios/App/Podfile"
          step cap-sync npx cap sync ios
      - name: Permission texts
        run: |
          source ../desktop/ci-step.sh
          # without these iOS kills the app the moment the camera or photo picker is opened
          P=ios/App/App/Info.plist
          step plist bash -c "/usr/libexec/PlistBuddy -c 'Add :NSCameraUsageDescription string Prek! bruker kameraet når du tar et bilde som du vil sende i en samtale eller bruke som profilbilde.' $P; /usr/libexec/PlistBuddy -c 'Add :NSPhotoLibraryUsageDescription string Prek! trenger tilgang til bildene dine når du velger et bilde å sende eller bruke som profilbilde.' $P; /usr/libexec/PlistBuddy -c 'Print' $P | grep -c UsageDescription"
      - name: Push notifications
        run: |
          source ../desktop/ci-step.sh
          # APNs: entitlement (incl. time-sensitive for double ping), background mode, and the ringing sound as the push sound
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>aps-environment</key><string>production</string>
          <key>com.apple.developer.usernotifications.time-sensitive</key><true/>
          </dict></plist>
          EOF
          P=ios/App/App/Info.plist
          step bgmode bash -c "/usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' $P; /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:0 string remote-notification' $P"
          step ring afconvert -f caff -d LEI16 ring.wav ios/App/App/ring.caf
          step xcodeproj-gem gem install xcodeproj --no-document --user-install
          step appdelegate python3 patch-appdelegate.py
          step xcodeproj bash -c 'export GEM_PATH="$(ruby -e "puts Gem.user_dir"):$(ruby -e "puts Gem.default_dir")"; ruby add-push.rb'
      - name: Version
        run: |
          source ../desktop/ci-step.sh
          cd ios/App
          step version bash -c "sed -i '' 's/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = 0.1.${{ github.run_number }};/; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/; s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $TEAM;/' App.xcodeproj/project.pbxproj"
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          source ../desktop/ci-step.sh
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do test -n "${!v}" || { echo "::error title=missing secret::$v is not set (Settings, Secrets and variables, Actions)"; exit 1; }; done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH="-authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          cd ios/App
          step archive xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/Prek.xcarchive" -allowProvisioningUpdates $AUTH DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic archive
          step diag bash -c 'A="$RUNNER_TEMP/Prek.xcarchive/Products/Applications/App.app"; echo "--- signed entitlements"; codesign -d --entitlements - "$A" 2>&1; echo "--- profile"; security cms -D -i "$A/embedded.mobileprovision" 2>/dev/null | grep -A1 -E "aps-environment|time-sensitive|ProfileDistributionType|Name" | head -30' || true
          step export-upload xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Prek.xcarchive" -exportOptionsPlist ../../ExportOptions.plist -allowProvisioningUpdates $AUTH
