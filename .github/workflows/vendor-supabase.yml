# One-off helper: fetches the exact supabase-js version the app uses from npm and offers the files as a download,
# so they can be committed to lib/ (the page then no longer loads code from a CDN at start-up). Run by hand.
name: vendor-supabase
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch
        run: |
          mkdir out
          (
            set -x
            npm pack @supabase/supabase-js@2.45.4
            ls -la
            mkdir x && tar xzf supabase-supabase-js-2.45.4.tgz -C x
            find x -maxdepth 3 | head -50
            cp x/package/dist/umd/supabase.min.js out/
            cp x/package/package.json out/
            cp x/package/LICENSE* out/ || true
            sha256sum out/supabase.min.js
            wc -c out/supabase.min.js
          ) > out/log.txt 2>&1 || echo "FAILED" >> out/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-js
          path: out
