# One-off helper: fetches the exact supabase-js version the app uses from npm and puts it on the branch "vendor-supabase",
# so it can be committed to lib/ (the page then no longer loads code from a CDN at start-up). Run by hand.
name: vendor-supabase
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and push to the vendor-supabase branch
        run: |
          mkdir -p /tmp/work out && cd /tmp/work
          npm pack @supabase/supabase-js@2.45.4 > pack.log 2>&1 || { echo "::error title=npm pack::$(tail -c 800 pack.log | tr '\n' '|')"; exit 1; }
          mkdir x && tar xzf supabase-supabase-js-2.45.4.tgz -C x
          cd "$GITHUB_WORKSPACE"
          mkdir -p vendor
          ls /tmp/work/x/package/dist/umd/ > /tmp/work/ls.txt 2>&1
          cp /tmp/work/x/package/dist/umd/supabase.js vendor/ || { echo "::error title=files::$(cat /tmp/work/ls.txt | tr '\n' ' ')"; exit 1; }
          cp /tmp/work/x/package/package.json vendor/supabase-js.package.json
          cp /tmp/work/x/package/LICENSE* vendor/ 2>/dev/null || true
          sha256sum vendor/supabase.js > vendor/supabase.js.sha256
          wc -c vendor/supabase.js
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b vendor-supabase
          git add vendor
          git commit -m "supabase-js 2.45.4 from npm"
          git push -f origin vendor-supabase
