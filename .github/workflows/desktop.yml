# Builds the Prek! app for Mac and Windows (Tauri). Run by hand (Actions -> desktop -> Run workflow).
# The apps are NOT signed: for testing among people we know. Mac: universal (Apple Silicon and Intel). Windows: installer (.exe).
# The finished files are in the run's "Artifacts" (only people with access to the repository can download them) and, for everyone, in a
# GitHub Release made at the end (public download links, and latest.json that the apps' updater reads; see claude/oppdatering.md).
# Needs the secret TAURI_SIGNING_PRIVATE_KEY (the updater key). The app version for the updater is 0.1.<run number> so every build is newer.
# Errors are written as annotations (red lines on the run page) because the build log itself is not always readable.
name: desktop
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            bundles: app,dmg
            target: --target universal-apple-darwin
            files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            upd: desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          - name: windows
            os: windows-latest
            bundles: nsis
            target: ""
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
            upd: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      CI: "true"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mac targets
        if: matrix.name == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install
        run: |
          source ./ci-step.sh
          step npm-install npm install --no-audit --no-fund
      - name: Prepare page and icons
        run: |
          source ./ci-step.sh
          step prepare node prepare.js
          step icons npx tauri icon app-icon.png
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          source ./ci-step.sh
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error title=missing secret::TAURI_SIGNING_PRIVATE_KEY is not set (Settings, Secrets and variables, Actions)"; exit 1; }
          step tauri-build npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target }} --config "{\"version\":\"0.1.${{ github.run_number }}\"}"
      - name: Name the files after the version and build code in the page
        run: |
          v=$(grep -o 'PREK_VERSION="[^"]*"' ../index.html | head -1 | cut -d'"' -f2)
          b=$(grep -o 'PREK_BUILD="[^"]*"' ../index.html | head -1 | cut -d'"' -f2)
          test -n "$v" -a -n "$b"
          src=$(ls ../${{ matrix.files }} | head -1)
          upd=$(ls ../${{ matrix.upd }} | head -1)
          test -f "$src" -a -f "$upd" -a -f "$upd.sig"
          base="prek-${{ matrix.name }}_${v}_${b}"
          mkdir -p rel
          cp "$src" "rel/$base.${src##*.}"
          if [ "$upd" != "$src" ]; then cp "$upd" "rel/$base.app.tar.gz"; cp "$upd.sig" "rel/$base.app.tar.gz.sig"; else cp "$upd.sig" "rel/$base.${src##*.}.sig"; fi
          ls -l rel
          echo "ART=$base" >> "$GITHUB_ENV"
          echo "OUT=desktop/rel/$base.${src##*.}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: ${{ env.OUT }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.name }}
          path: desktop/rel/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          path: rel
          merge-multiple: true
      - name: Make latest.json and the release
        run: |
          ls -l rel
          tag="v0.1.${{ github.run_number }}"
          node desktop/make-latest.js rel "${{ github.repository }}" "$tag" "0.1.${{ github.run_number }}" "Prek! build ${GITHUB_SHA::7}"
          b=$(ls rel | grep -o '_[0-9a-f]\{7\}\.' | head -1 | tr -d '_.')
          gh release create "$tag" rel/* --title "Prek! 0.1.${{ github.run_number }} (bygg $b)" --notes "Nedlasting for Mac (.dmg) og Windows (.exe). Appene oppdaterer seg selv fra denne siden. Ikke signert med Apple/Windows-sertifikat: se hjelpen for advarslene." --latest
