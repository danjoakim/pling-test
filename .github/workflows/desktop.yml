# Builds the Prek! app for Mac and Windows (Tauri). Run by hand (Actions -> desktop -> Run workflow).
# The apps are NOT signed: for testing among people we know. Mac: universal (Apple Silicon and Intel). Windows: installer (.exe).
# The finished files are in the run's "Artifacts" (only people with access to the repository can download them).
# Errors are written as annotations (red lines on the run page) because the build log itself is not always readable.
name: desktop
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            bundles: dmg
            target: --target universal-apple-darwin
            files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            bundles: nsis
            target: ""
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      CI: "true"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mac targets
        if: matrix.name == 'mac'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install
        run: |
          source ./ci-step.sh
          step npm-install npm install --no-audit --no-fund
      - name: Prepare page and icons
        run: |
          source ./ci-step.sh
          step prepare node prepare.js
          step icons npx tauri icon app-icon.png
      - name: Build
        run: |
          source ./ci-step.sh
          step tauri-build npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target }}
      - name: Name the file and the download after the version and build code in the page
        run: |
          v=$(grep -o 'PREK_VERSION="[^"]*"' ../index.html | head -1 | cut -d'"' -f2)
          b=$(grep -o 'PREK_BUILD="[^"]*"' ../index.html | head -1 | cut -d'"' -f2)
          test -n "$v" -a -n "$b"
          src=$(ls ../${{ matrix.files }} | head -1)
          test -f "$src"
          ext="${src##*.}"
          out="$(dirname "$src")/prek-${{ matrix.name }}_${v}_${b}.${ext}"
          mv "$src" "$out"
          echo "ART=prek-${{ matrix.name }}_${v}_${b}" >> "$GITHUB_ENV"
          echo "OUT=${out#../}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: ${{ env.OUT }}
          if-no-files-found: error
