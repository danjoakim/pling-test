<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pling testside</title>
<style>
:root{color-scheme:dark;--bg:#0b1430;--pane:#101d45;--line:#27407f;--txt:#e8efff;--dim:#93a6d6;--acc:#4da3ff;--ok:#8cff5a;--bad:#ff7a6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 "Segoe UI",Tahoma,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.dim{color:var(--dim);font-size:14px}
.card{background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
input,button{font:inherit;color:var(--txt);background:#0b1636;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input{width:100%}
button{cursor:pointer;background:#1b3a86}
button:hover{background:#2450b3}
button.ghost{background:transparent}
button.small{padding:4px 9px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:260px 1fr;gap:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.fr{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px;border-radius:8px;cursor:pointer}
.fr:hover,.fr.on{background:#1a2f6b}
#log{height:46vh;min-height:220px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.m{max-width:80%;padding:7px 10px;border-radius:10px;background:#1a2f6b;word-wrap:break-word}
.m.me{align-self:flex-end;background:#2a5fd0}
.m small{display:block;color:var(--dim);font-size:11px}
#toast{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;margin:auto;background:#1a2f6b;border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:none}
#toast.bad{border-color:var(--bad)}
.tag{font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.sec{color:var(--ok)}
.code{font:700 min(20px,4.3vw)/1.5 ui-monospace,Consolas,monospace;letter-spacing:.03em;white-space:nowrap;background:#0b1636;border:1px dashed var(--acc);border-radius:10px;padding:14px 8px;text-align:center;user-select:all}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block}
.qr svg{display:block;width:min(70vw,300px);height:auto}
video{width:100%;max-width:360px;border-radius:10px;background:#000}
textarea{width:100%;font:13px ui-monospace,Consolas,monospace;color:var(--txt);background:#0b1636;border:1px solid var(--line);border-radius:8px;padding:8px;min-height:70px}
.warn{color:#ffd37a}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script>
"use strict";
const SB_URL="https://frvnbcltyvcnyympmjua.supabase.co";
// Offentlig nøkkel (anon). Den er laget for å ligge i nettsider; tilgangsreglene i databasen beskytter dataene.
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZydm5iY2x0eXZjbnl5bXBtanVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTQ0MjEsImV4cCI6MjEwODI3MDQyMX0.eh5mH2kCPXXgbQ8wH-vzU2wDAmCJ43Oj-Y8mu6jNaiA";

const $=(s,r=document)=>r.querySelector(s);
const el=(tag,props={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e};
let toastT=0;
function toast(msg,bad){const t=$("#toast");t.textContent=msg;t.className=bad?"bad":"";t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",bad?7000:3500)}
const fail=(e,ctx)=>{console.error(ctx,e);toast((ctx?ctx+": ":"")+(e&&e.message||e),true)};

if(!window.supabase){document.getElementById("app").textContent="Klarte ikke å laste Supabase-biblioteket (nettverk blokkert?).";throw new Error("supabase mangler")}
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

/* ---------- kryptering (samme prinsipp som i Pling) ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ECDH={name:"ECDH",namedCurve:"P-256"};
async function fpOf(pub){const c=JSON.stringify({crv:pub.crv,kty:pub.kty,x:pub.x,y:pub.y});const h=await crypto.subtle.digest("SHA-256",enc.encode(c));return[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,32)}
const keyName=uid=>"pling_test_key_"+uid;
function loadIdentity(uid){try{const j=JSON.parse(localStorage.getItem(keyName(uid))||"null");return j}catch(e){return null}}
async function makeIdentity(uid){
  const kp=await crypto.subtle.generateKey(ECDH,true,["deriveKey"]);
  const priv=await crypto.subtle.exportKey("jwk",kp.privateKey),pub=await crypto.subtle.exportKey("jwk",kp.publicKey);
  const id={priv,pub:{crv:pub.crv,kty:pub.kty,x:pub.x,y:pub.y}};
  localStorage.setItem(keyName(uid),JSON.stringify(id));return id;
}
const pairCache=new Map();
async function pairKey(theirPub){
  const k=JSON.stringify(theirPub);if(pairCache.has(k))return pairCache.get(k);
  const priv=await crypto.subtle.importKey("jwk",S.id.priv,ECDH,false,["deriveKey"]);
  const pub=await crypto.subtle.importKey("jwk",theirPub,ECDH,false,[]);
  const key=await crypto.subtle.deriveKey({name:"ECDH",public:pub},priv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  pairCache.set(k,key);return key;
}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj)));return{iv:b64(iv),ct:b64(ct)}}
async function open(key,iv,ct){try{return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(iv)},key,ub64(ct))))}catch(e){return null}}

/* ---------- gjenopprettingskode og enhetsoverføring ---------- */
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function newCode(){const r=crypto.getRandomValues(new Uint8Array(25));let t="";for(const b of r)t+=B32[b&31];return t.match(/.{5}/g).join("-")}
const normCode=c=>c.toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");
async function codeKey(code,salt,iter){
  const base=await crypto.subtle.importKey("raw",enc.encode(normCode(code)),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function makeBackup(code){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iter=600000;
  const key=await codeKey(code,salt,iter);
  const s=await seal(key,{v:1,priv:S.id.priv,pub:S.id.pub});
  return{user_id:S.user.id,salt:b64(salt),iv:s.iv,ct:s.ct,iter,updated_at:new Date().toISOString()};
}
async function saveBackup(code){await q(sb.from("key_backups").upsert(await makeBackup(code)),"Lagre sikkerhetskopi");S.backup={updated_at:new Date().toISOString()}}
async function restoreFromCode(code){
  const rows=await q(sb.from("key_backups").select("*").eq("user_id",S.user.id),"Hente sikkerhetskopi");
  if(!rows.length)throw new Error("Det finnes ingen sikkerhetskopi på denne kontoen");
  const r=rows[0],key=await codeKey(code,ub64(r.salt),r.iter),o=await open(key,r.iv,r.ct);
  if(!o)throw new Error("Koden stemmer ikke");
  return{priv:o.priv,pub:o.pub};
}
const b64u=s=>s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4));
function transferText(){const p=S.id.priv;return"PLING1."+b64u(btoa(JSON.stringify({u:S.user.id,x:p.x,y:p.y,d:p.d})))}
function parseTransfer(t){
  t=(t||"").trim();if(!t.startsWith("PLING1."))throw new Error("Ikke en Pling-overføringskode");
  let o;try{o=JSON.parse(unb64u(t.slice(7)))}catch(e){throw new Error("Overføringskoden er ødelagt")}
  if(o.u!==S.user.id)throw new Error("Koden hører til en annen konto");
  return{priv:{kty:"EC",crv:"P-256",x:o.x,y:o.y,d:o.d,ext:true,key_ops:["deriveKey"]},pub:{crv:"P-256",kty:"EC",x:o.x,y:o.y}};
}
async function adoptIdentity(id){
  const fp=await fpOf(id.pub);
  if(fp!==S.profile.fp)throw new Error("Nøkkelen passer ikke til denne kontoen");
  localStorage.setItem(keyName(S.user.id),JSON.stringify(id));S.id=id;pairCache.clear();
}
function qrSvg(text){const qr=qrcode(0,"M");qr.addData(text);qr.make();return qr.createSvgTag({cellSize:5,margin:0,scalable:true})}
const download=(name,text)=>{const a=el("a",{href:URL.createObjectURL(new Blob([text],{type:"text/plain"})),download:name});document.body.append(a);a.click();a.remove()};

/* ---------- tilstand ---------- */
const S={backup:null,user:null,profile:null,id:null,profiles:new Map(),friends:[],reqIn:[],reqOut:[],chat:null,msgs:[],mode:"in",needCode:false};
const q=async(p,ctx)=>{const r=await p;if(r.error)throw new Error((ctx?ctx+": ":"")+r.error.message);return r.data};

/* ---------- innlogging ---------- */
function viewLogin(){
  const app=$("#app");app.textContent="";
  const email=el("input",{type:"email",placeholder:"E-post",autocomplete:"email",id:"em"});
  const pw=el("input",{type:"password",placeholder:"Passord (minst 10 tegn)",autocomplete:S.mode==="up"?"new-password":"current-password",id:"pw"});
  const code=el("input",{type:"text",placeholder:"Kode fra e-posten",inputmode:"numeric",id:"cd",autocomplete:"one-time-code"});
  const go=async()=>{
    try{
      if(S.mode==="up"){
        const d=await q(sb.auth.signUp({email:email.value.trim(),password:pw.value}),"Ny konto");
        if(!d.session)toast("Konto laget. Sjekk e-posten din for bekreftelse, og logg inn etterpå.");
      }else{
        await q(sb.auth.signInWithPassword({email:email.value.trim(),password:pw.value}),"Innlogging");
      }
    }catch(e){fail(e)}
  };
  const sendCode=async()=>{try{await q(sb.auth.signInWithOtp({email:email.value.trim(),options:{emailRedirectTo:location.origin+location.pathname}}),"Send kode");S.needCode=true;toast("E-post sendt. Skriv inn koden (eller trykk på lenken i e-posten).");viewLogin()}catch(e){fail(e)}};
  const verify=async()=>{try{await q(sb.auth.verifyOtp({email:email.value.trim(),token:code.value.trim(),type:"email"}),"Bekreft kode")}catch(e){fail(e)}};
  app.append(
    el("h1",{},"Pling · testside"),
    el("div",{class:"dim"},"Kryptert samtale mellom to nettlesere. Bare for testing."),
    el("div",{class:"card"},
      el("div",{class:"row"},
        el("button",{class:S.mode==="in"?"":"ghost",onclick:()=>{S.mode="in";viewLogin()}},"Logg inn"),
        el("button",{class:S.mode==="up"?"":"ghost",onclick:()=>{S.mode="up";viewLogin()}},"Ny konto")),
      el("p",{},email),el("p",{},pw),
      el("div",{class:"row"},el("button",{id:"go",onclick:go},S.mode==="up"?"Lag konto":"Logg inn"),
        el("button",{class:"ghost",id:"otp",onclick:sendCode},"Send engangskode i stedet")),
      S.needCode?el("div",{class:"row",style:"margin-top:10px"},code,el("button",{id:"vf",onclick:verify},"Bekreft")):null
    ));
  pw.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}

/* ---------- oppsett av profil ---------- */
async function afterLogin(user){
  S.user=user;
  const rows=await q(sb.from("profiles").select("*").eq("id",user.id),"Hente profil");
  S.profile=rows[0]||null;S.id=loadIdentity(user.id);
  if(S.profile&&!S.id){viewNoKey();return}
  if(!S.profile){viewSetup();return}
  const fp=await fpOf(S.id.pub);
  if(fp!==S.profile.fp){viewNoKey();return}
  await start();
}
function viewSetup(){
  const app=$("#app");app.textContent="";
  const name=el("input",{type:"text",placeholder:"Visningsnavn",maxlength:"40",id:"nm"});
  const go=async()=>{
    const n=name.value.trim();if(!n)return toast("Skriv et navn",true);
    try{
      const id=S.id||await makeIdentity(S.user.id);S.id=id;
      const fp=await fpOf(id.pub);
      await q(sb.from("profiles").insert({id:S.user.id,fp,name:n,pub:id.pub}),"Lage profil");
      S.profile={id:S.user.id,fp,name:n,pub:id.pub};showRecovery(true);
    }catch(e){fail(e)}
  };
  app.append(el("h1",{},"Velkommen"),el("div",{class:"card"},
    el("p",{},"Velg navnet vennene dine skal se. Nøkkelen som krypterer samtalene lages nå, og blir liggende i denne nettleseren."),
    el("p",{},name),el("button",{id:"mk",onclick:go},"Fortsett")));
}
function viewNoKey(){
  const app=$("#app");app.textContent="";
  const code=el("input",{type:"text",placeholder:"XXXXX-XXXXX-XXXXX-XXXXX-XXXXX",id:"rc",autocapitalize:"characters",autocomplete:"off"});
  const tr=el("textarea",{id:"tt",placeholder:"PLING1.…"});
  const done=async id=>{try{await adoptIdentity(id);toast("Nøkkelen er tilbake");await start()}catch(e){fail(e)}};
  app.append(el("h1",{},"Nøkkelen finnes ikke her"),
    el("div",{class:"card"},el("p",{},"Du har en konto, men denne nettleseren har ikke krypteringsnøkkelen din. Hent den tilbake på en av disse måtene:")),
    el("div",{class:"card"},el("strong",{},"1. Gjenopprettingskode"),el("p",{class:"dim"},"Koden du fikk da du lagde kontoen."),
      el("div",{class:"row"},code,el("button",{id:"rcgo",onclick:async()=>{try{await done(await restoreFromCode(code.value))}catch(e){fail(e)}}},"Gjenopprett"))),
    el("div",{class:"card"},el("strong",{},"2. Fra en annen enhet der du er logget inn"),el("p",{class:"dim"},"Velg «Flytt til ny enhet» der, og skann QR-koden her, eller lim inn overføringskoden."),
      el("div",{class:"row"},el("button",{id:"scan",onclick:()=>scanQr(done)},"Skann QR-kode")),
      el("p",{},tr),el("button",{id:"ttgo",onclick:async()=>{try{await done(parseTransfer(tr.value))}catch(e){fail(e)}}},"Bruk overføringskode")),
    el("button",{class:"ghost",onclick:()=>sb.auth.signOut()},"Logg ut"));
}
function scanQr(done){
  const app=$("#app");app.textContent="";
  const v=el("video",{playsinline:true,muted:true,id:"vid"});let stop=false,stream=null;
  const end=()=>{stop=true;if(stream)stream.getTracks().forEach(t=>t.stop())};
  app.append(el("h1",{},"Skann QR-koden"),el("div",{class:"card"},v,el("p",{class:"dim",id:"scs"},"Holder kameraet mot QR-koden på den gamle enheten …"),
    el("button",{class:"ghost",onclick:()=>{end();viewNoKey()}},"Avbryt")));
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(st=>{
    if(stop){st.getTracks().forEach(t=>t.stop());return}
    stream=st;v.srcObject=st;v.play();
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    const tick=()=>{
      if(stop)return;
      if(v.readyState>=2&&v.videoWidth){
        cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
        const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
        if(r&&r.data.startsWith("PLING1.")){end();let id;try{id=parseTransfer(r.data)}catch(e){fail(e);viewNoKey();return}done(id);return}
      }
      setTimeout(tick,120);
    };tick();
  }).catch(e=>{end();fail(new Error("Fikk ikke tilgang til kameraet. Bruk overføringskoden i stedet."));viewNoKey()});
}

/* ---------- gjenopprettingskode ---------- */
function showRecovery(first){
  const app=$("#app");app.textContent="";
  const code=newCode();
  const typed=el("input",{type:"text",placeholder:"Skriv koden på nytt for å bekrefte",id:"rcv",autocapitalize:"characters",autocomplete:"off"});
  const go=async()=>{
    if(normCode(typed.value)!==normCode(code))return toast("Koden stemmer ikke. Sjekk at du har skrevet den av riktig.",true);
    try{await saveBackup(code);toast("Gjenopprettingskoden er aktivert");await start()}catch(e){fail(e)}
  };
  app.append(el("h1",{},first?"Siste steg: gjenopprettingskode":"Ny gjenopprettingskode"),
    el("div",{class:"card"},
      el("p",{},"Denne koden er den eneste måten å få tilbake samtalene dine på hvis du mister alle enhetene dine. Ikke engang vi kan hjelpe deg uten den."),
      el("div",{class:"code",id:"rccode"},code),
      el("div",{class:"row",style:"margin-top:10px"},
        el("button",{class:"small",id:"cp",onclick:async()=>{try{await navigator.clipboard.writeText(code);toast("Kopiert")}catch(e){toast("Kunne ikke kopiere. Marker koden og kopier selv.",true)}}},"Kopier"),
        el("button",{class:"small",id:"dl",onclick:()=>download("pling-gjenopprettingskode.txt","Pling gjenopprettingskode\n\n"+code+"\n\nOppbevar denne trygt. Alle med koden og passordet ditt kan åpne samtalene dine.\n")},"Last ned")),
      el("p",{class:"warn"},"Lagre den i passordbehandleren din eller skriv den ned og oppbevar den trygt.")),
    el("div",{class:"card"},el("p",{},typed),el("div",{class:"row"},el("button",{id:"rcgo",onclick:go},"Jeg har lagret den"),
      el("button",{class:"ghost small",id:"skip",onclick:()=>{if(first)start();else{viewMain();refresh()}}},first?"Hopp over":"Avbryt"))));
}
function showQr(){
  const app=$("#app");app.textContent="";
  app.append(el("h1",{},"Flytt til ny enhet"),
    el("div",{class:"card"},
      el("p",{},"Denne funksjonen er midlertidig skrudd av. Den viste nøkkelen som tekst i en QR-kode, og et vanlig kameraprogram kan da lese og sende teksten videre, for eksempel til et nettsøk."),
      el("p",{},"Bruk gjenopprettingskoden til å hente nøkkelen på en ny enhet mens vi bygger en tryggere løsning."),
      el("p",{},el("button",{id:"qrback",onclick:()=>{viewMain();refresh()}},"Tilbake"))));
}

/* ---------- hovedvisning ---------- */
async function start(){
  try{const bk=await q(sb.from("key_backups").select("user_id,updated_at").eq("user_id",S.user.id));S.backup=bk[0]||null}catch(e){S.backup=null}
  viewMain();await refresh();
  sb.channel("pling-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"messages"},()=>refreshSoon())
    .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests"},()=>refreshSoon())
    .on("postgres_changes",{event:"*",schema:"public",table:"friends"},()=>refreshSoon())
    .subscribe();
  clearInterval(S.poll);S.poll=setInterval(()=>{if(S.user&&!document.hidden)refresh()},8000);
}
let rT=0;function refreshSoon(){clearTimeout(rT);rT=setTimeout(refresh,150)}
async function refresh(){
  if(!S.user||!S.profile)return;
  try{
    const [fr,rq]=await Promise.all([q(sb.from("friends").select("*"),"Venner"),q(sb.from("friend_requests").select("*"),"Forespørsler")]);
    const ids=new Set();
    S.friends=fr.map(r=>r.a===S.user.id?r.b:r.a);S.friends.forEach(i=>ids.add(i));
    S.reqIn=rq.filter(r=>r.to_id===S.user.id).map(r=>r.from_id);S.reqIn.forEach(i=>ids.add(i));
    S.reqOut=rq.filter(r=>r.from_id===S.user.id).map(r=>r.to_id);S.reqOut.forEach(i=>ids.add(i));
    if(ids.size){const ps=await q(sb.from("profiles").select("id,name,fp,pub").in("id",[...ids]),"Profiler");ps.forEach(p=>S.profiles.set(p.id,p))}
    if(S.chat&&!S.friends.includes(S.chat.other)){S.chat=null;S.msgs=[]}
    renderSide();
    if(S.chat)await loadMsgs();else renderChat();
  }catch(e){fail(e)}
}
function viewMain(){
  const app=$("#app");app.textContent="";
  app.append(
    el("div",{class:"row",style:"justify-content:space-between"},
      el("div",{},el("h1",{},"Pling · testside"),el("div",{class:"dim"},S.profile.name+" · "+S.user.email)),
      el("button",{class:"ghost small",id:"out",onclick:async()=>{await sb.auth.signOut()}},"Logg ut")),
    el("div",{class:"grid"},el("div",{id:"side"}),el("div",{id:"chat"})));
}
function renderSide(){
  const side=$("#side");if(!side)return;side.textContent="";
  const mail=el("input",{type:"email",placeholder:"Venns e-post",id:"fe"});
  const add=async()=>{
    const v=mail.value.trim();if(!v)return;
    try{
      const f=await q(sb.rpc("find_by_email",{p_email:v}),"Søk");
      if(!f.length)return toast("Fant ingen med den e-posten. Vennen må ha laget konto og profil først.",true);
      const r=await q(sb.rpc("send_request",{p_to:f[0].id}),"Forespørsel");
      toast(r==="friends"?"Dere er venner nå":"Forespørsel sendt til "+f[0].name);mail.value="";refresh();
    }catch(e){fail(e)}
  };
  side.append(el("div",{class:"card"},el("div",{class:"dim"},"Legg til venn"),el("div",{class:"row",style:"margin-top:6px"},mail,el("button",{id:"add",onclick:add},"Legg til"))));
  if(S.reqIn.length)side.append(el("div",{class:"card"},el("div",{class:"dim"},"Forespørsler til deg"),
    S.reqIn.map(id=>{const p=S.profiles.get(id);return el("div",{class:"fr"},el("span",{},p?p.name:"…"),
      el("span",{class:"row"},el("button",{class:"small acc",onclick:async()=>{try{await q(sb.rpc("accept_request",{p_from:id}),"Godta");refresh()}catch(e){fail(e)}}},"Godta"),
        el("button",{class:"small ghost",onclick:async()=>{try{await q(sb.from("friend_requests").delete().eq("from_id",id).eq("to_id",S.user.id),"Avslå");refresh()}catch(e){fail(e)}}},"Avslå")))})));
  if(S.reqOut.length)side.append(el("div",{class:"card"},el("div",{class:"dim"},"Venter på svar"),S.reqOut.map(id=>{const p=S.profiles.get(id);return el("div",{class:"fr"},el("span",{},p?p.name:"…"),el("span",{class:"tag"},"venter"))})));
  side.append(el("div",{class:"card"},el("div",{class:"dim"},"Sikkerhet"),
    el("div",{class:S.backup?"sec":"warn",style:"margin:6px 0",id:"bkst"},S.backup?"Gjenopprettingskode er laget":"Du har ingen gjenopprettingskode ennå"),
    el("div",{class:"row"},el("button",{class:"small",id:"mkcode",onclick:()=>showRecovery(false)},S.backup?"Lag ny kode":"Lag kode"),
      el("button",{class:"small ghost",id:"mkqr",onclick:showQr},"Flytt til ny enhet"))));
  side.append(el("div",{class:"card"},el("div",{class:"dim"},"Venner"),
    S.friends.length?S.friends.map(id=>{const p=S.profiles.get(id);return el("div",{class:"fr"+(S.chat&&S.chat.other===id?" on":""),"data-id":id,onclick:()=>openChat(id)},el("span",{},p?p.name:"…"))}):el("div",{class:"dim"},"Ingen ennå")));
}
async function openChat(otherId){
  try{
    const cid=await q(sb.rpc("open_dm",{p_other:otherId}),"Åpne samtale");
    S.chat={id:cid,other:otherId};S.msgs=[];renderSide();renderChat();await loadMsgs();
  }catch(e){fail(e)}
}
async function loadMsgs(){
  if(!S.chat)return;
  const other=S.profiles.get(S.chat.other);if(!other)return;
  const rows=await q(sb.from("messages").select("*").eq("chat_id",S.chat.id).order("id",{ascending:true}).limit(300),"Meldinger");
  const key=await pairKey(other.pub);
  const out=[];
  for(const r of rows){const m=await open(key,r.iv,r.ct);out.push({id:r.id,mine:r.sender===S.user.id,t:m?m.t:null,ts:r.created_at})}
  const sig=out.map(m=>m.id).join(",");
  if(sig===S.sig)return;S.sig=sig;S.msgs=out;renderChat(true);
}
function renderChat(keep){
  const box=$("#chat");if(!box)return;
  if(!S.chat){box.textContent="";box.append(el("div",{class:"card dim"},"Velg en venn for å starte en samtale."));return}
  const other=S.profiles.get(S.chat.other);
  let log=$("#log");
  if(!log||box.dataset.cid!==S.chat.id){
    box.textContent="";box.dataset.cid=S.chat.id;
    const inp=el("input",{type:"text",placeholder:"Skriv en melding …",id:"msg",autocomplete:"off"});
    const send=async()=>{
      const t=inp.value.trim();if(!t)return;inp.value="";
      try{
        const key=await pairKey(other.pub);const s=await seal(key,{t,ts:Date.now()});
        await q(sb.from("messages").insert({chat_id:S.chat.id,sender:S.user.id,iv:s.iv,ct:s.ct}),"Sende");
        refreshSoon();
      }catch(e){inp.value=t;fail(e)}
    };
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
    let sure=false;
    const rm=el("button",{class:"small ghost",id:"rm",onclick:async()=>{
      if(!sure){sure=true;rm.textContent="Sikker? Trykk igjen";setTimeout(()=>{sure=false;rm.textContent="Fjern venn"},3500);return}
      try{await q(sb.rpc("remove_friend",{p_other:S.chat.other}),"Fjerne venn");S.chat=null;refresh()}catch(e){fail(e)}
    }},"Fjern venn");
    box.append(el("div",{class:"card"},
      el("div",{class:"row",style:"justify-content:space-between"},el("strong",{},other?other.name:"…"),el("span",{class:"row"},el("span",{class:"tag sec"},"ende-til-ende-kryptert"),rm)),
      el("div",{id:"log"}),el("div",{class:"row",style:"margin-top:8px"},inp,el("button",{id:"send",onclick:send},"Send"))));
    log=$("#log");
  }
  log.textContent="";
  for(const m of S.msgs)log.append(el("div",{class:"m"+(m.mine?" me":"")},m.t==null?"(kan ikke dekrypteres)":m.t,el("small",{},new Date(m.ts).toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"}))));
  log.scrollTop=log.scrollHeight;
}

/* ---------- start ---------- */
sb.auth.onAuthStateChange((ev,session)=>{
  if(session&&session.user){if(!S.user||S.user.id!==session.user.id)setTimeout(()=>afterLogin(session.user).catch(e=>fail(e)),0)}
  else{S.user=null;S.profile=null;S.id=null;S.chat=null;clearInterval(S.poll);sb.removeAllChannels();viewLogin()}
});
sb.auth.getSession().then(({data})=>{if(!data.session)viewLogin()});
</script>
